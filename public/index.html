<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#040a14">
<title>Resultados Kelly Menezes JB</title>

<style>
:root{color-scheme:dark;--bg:#070c19;--panel:#101b30;--panel2:#14223a;--line:#283a55;--text:#f5f8ff;--muted:#a8b8d1;--cyan:#55dcff;--mint:#62efbd;--gold:#ffd47a;--grad:linear-gradient(115deg,#63dcff,#66edbc)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 850px 430px at 90% -10%,#163f55 0%,transparent 70%),radial-gradient(ellipse 800px 650px at -20% 45%,#10233d 0%,transparent 70%),var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
.container{width:min(1380px,calc(100% - 48px));margin:0 auto;padding:26px 0 42px}
.hero{position:relative;display:flex;justify-content:space-between;align-items:center;gap:25px;overflow:hidden;padding:32px 38px;border:1px solid #2a5065;border-radius:26px;background:linear-gradient(120deg,#122a45,#102037 58%,#133c45);box-shadow:0 18px 55px #0005}
.hero:after{content:"";position:absolute;width:370px;height:370px;right:-100px;top:-210px;border:65px solid #73e8d60d;border-radius:50%;pointer-events:none}
.brand-kicker{display:block;margin-bottom:8px;color:#8ce6e3;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2.5px}
.hero h1{margin:0;font-size:clamp(28px,3.5vw,49px);line-height:1.08;letter-spacing:-1.7px;font-weight:900}.hero h1 span{display:block;background:var(--grad);color:transparent;background-clip:text}.hero p{margin:12px 0 0;color:#c3d6e7;font-size:14px;font-weight:650}
.quickbar{display:flex;flex-direction:column;align-items:flex-end;gap:12px;position:relative;z-index:1}.live-pill{border:1px solid #33735e;background:#123f39;color:#94f5cb;padding:9px 14px;border-radius:50px;font-size:12px;font-weight:800;white-space:nowrap}.live-pill:before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.quicklink{color:#fff;text-decoration:none;background:#ffffff13;border:1px solid #ffffff30;border-radius:12px;padding:10px 15px;font-size:13px;font-weight:750;white-space:nowrap}.quicklink:hover{background:#ffffff24}
.topbar{position:sticky;top:10px;z-index:5;margin:20px 0 24px;padding:20px 22px;border:1px solid var(--line);border-radius:22px;background:#0e1929f2;backdrop-filter:blur(16px);box-shadow:0 14px 40px #0007}
.filter-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.filter-heading h2{margin:0;font-size:15px;letter-spacing:.2px}.filter-heading small{color:var(--muted);font-size:12px}.filter-label{font-size:10px;color:#91a7c1;letter-spacing:1.6px;font-weight:900;text-transform:uppercase;margin:0 0 8px}.tags,.datas{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;justify-content:center;min-height:37px;padding:8px 15px;background:#17273e;border:1px solid #30435e;border-radius:11px;color:#d5e1f1;font-size:12px;font-weight:800;cursor:pointer;transition:background .2s,transform .2s}.tag:hover{background:#25405a;transform:translateY(-1px)}.tag.active{background:var(--grad);border-color:transparent;color:#062034;box-shadow:0 4px 18px #52d6df29}
.filtrosLinha{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.datas{flex:1}.btnAtualizar{flex-shrink:0;background:var(--grad);color:#062333;border:0;border-radius:11px;padding:11px 20px;min-height:39px;font:800 13px inherit;cursor:pointer;font-weight:900}.btnAtualizar:hover{filter:brightness(1.1)}.status{margin-top:13px;font-size:11px;color:#9cb0c9}.status:before{content:"";display:inline-block;width:7px;height:7px;background:var(--mint);border-radius:50%;margin-right:7px}
#loteriaSelect{display:none!important}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 3px 17px;font-size:19px;font-weight:900}.section-heading:after{content:"Atualização automática";color:#91a6c0;font-size:12px;font-weight:650}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.diaTitulo{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:15px 0 0;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#8ee8f6}.diaTitulo:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#3a6b7d,transparent)}.diaTitulo:first-child{margin-top:0}
.card{position:relative;overflow:hidden;background:linear-gradient(150deg,#172840,#101b2e);border:1px solid #2c405d;border-radius:19px;padding:19px;box-shadow:0 10px 30px #0003;transition:transform .2s,border-color .2s}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--grad)}.card:hover{transform:translateY(-3px);border-color:#4a93a8}.cardTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.loteriaNome{display:block;color:#a2f4d1;font-size:16px;font-weight:900;line-height:1.3}.cardData{display:block;color:var(--muted);font-size:12px;margin-top:4px}.horarioDestaque{font-size:25px;font-weight:900;color:#83e5ff;white-space:nowrap}.semHora{color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #2b3d55;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #26364d}th{background:#20314a;color:#aabdd6;font-size:10px;letter-spacing:.7px;text-transform:uppercase}td{font-size:13px;color:#d6e2f1}tbody tr:nth-child(2n){background:#ffffff06}tbody tr:first-child{background:#f5c66c14}tbody tr:last-child td{border-bottom:0}.milhar{color:#fff;font-size:23px;font-weight:900;letter-spacing:1.5px;font-variant-numeric:tabular-nums}tbody tr:first-child .milhar{color:var(--gold)}.cardRodape{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:14px;color:var(--muted);font-size:11px}.share{padding:9px 12px;border-radius:10px;background:#163d3c;border:1px solid #2d7767;color:#a3f7d8;font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}.share:hover{background:#1b514a}.empty{grid-column:1/-1;text-align:center;padding:70px 18px;border:1px dashed #36506b;border-radius:18px;color:var(--muted)}footer{padding:28px 0 0;text-align:center;color:#859ab5;font-size:12px}
.tag:focus-visible,.quicklink:focus-visible,button:focus-visible{outline:3px solid #72e7ff;outline-offset:3px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.container{width:calc(100% - 24px);padding-top:12px}.hero{display:block;padding:26px 20px;border-radius:20px}.hero h1{font-size:clamp(27px,8vw,37px)}.quickbar{align-items:flex-start;flex-direction:row;flex-wrap:wrap;margin-top:20px;gap:8px}.quicklink,.live-pill{font-size:11px}.topbar{position:static;margin:13px 0 20px;padding:16px 13px}.filter-heading small{display:none}.tags{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.tag{flex-shrink:0}.filtrosLinha{align-items:stretch}.datas{flex-wrap:nowrap;overflow-x:auto;align-items:center}.btnAtualizar{padding:9px 12px}.grid{grid-template-columns:1fr;gap:13px}.card{padding:16px}.section-heading{font-size:17px}.section-heading:after{font-size:10px}.diaTitulo{margin-top:10px}}
@media(max-width:370px){.milhar{font-size:20px}.cardRodape{flex-wrap:wrap}.share{white-space:normal}.tag{padding:8px 11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>

<body>
<div class="container">

  <section class="hero">
    <div class="brand-kicker">Central Kelly • Resultados</div>
    <span class="hero-spark one" aria-hidden="true">✦</span><span class="hero-spark two" aria-hidden="true">✧</span>
    <h1>Resultados <span>Kelly Menezes JB</span></h1>
    <p>✦ Chama no milhar! ✦</p>
    <div class="quickbar"><span class="live-pill">Painel de resultados</span><a class="quicklink" href="https://kellymenezes.app/" target="_blank" rel="noopener noreferrer">✦ Central Kelly ↗</a></div>
  </section>

  <section class="topbar">
    <select id="loteriaSelect" hidden><option value="todas">Todas as loterias</option></select>
    <div class="filter-heading"><h2>Filtrar resultados</h2><small>Selecione a loteria e o período</small></div>
    <div class="filter-label">Loterias</div>
    <div class="tags" id="tags"></div>
    <div class="filtrosLinha">
      <div class="datas" id="datas">
        <div class="tag active" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('todos', this)">Todas as datas</div>
        <div class="tag" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('hoje', this)">Hoje</div>
        <div class="tag" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('ontem', this)">Ontem</div>
      </div>
      <button class="btnAtualizar" onclick="aplicarFiltro()">Atualizar</button>
    </div>
    <div class="status" id="status">Carregando resultados...</div>
  </section>

  <div class="section-heading">Últimos resultados</div>
  <main class="grid" id="gridResultados"></main>

  <footer>© Kelly Menezes JB</footer>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6iyfXbCt-fHL5Wt5zNS5myKq-njJzbms",
  authDomain: "resultados-loterias-3979a.firebaseapp.com",
  projectId: "resultados-loterias-3979a",
  storageBucket: "resultados-loterias-3979a.firebasestorage.app",
  messagingSenderId: "109416331388",
  appId: "1:109416331388:web:8e04783520d08adc87b1f9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("gridResultados");
const statusEl = document.getElementById("status");
const select = document.getElementById("loteriaSelect");
const tags = document.getElementById("tags");

let todosResultados = [];

function escapeHtml(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function normalizar(texto){
  return String(texto || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function paraNumero(v){
  if(!v) return 0;
  if(typeof v.toMillis === "function") return v.toMillis(); // Timestamp do Firestore
  const n = Number(v);
  return Number.isNaN(n) ? 0 : n;
}

function ordem(item){
  return paraNumero(item.dataOrdenacao) || paraNumero(item.atualizado) ||
         paraNumero(item.updatedAt) || paraNumero(item.createdAt);
}

function limparDocumentosInvalidos(lista){
  lista = lista.map(item => ({ ...item, loteria: item.loteria || item.titulo || "" }));

  return lista.filter(item => {
    const titulo = String(item.titulo || "").toLowerCase();
    const loteria = String(item.loteria || "").toLowerCase();

    if(!item.loteria) return false;
    if(!item.premios || (Array.isArray(item.premios) && !item.premios.length)) return false;
    if(Array.isArray(item.premios) && item.premios.some(p => !/^\d{4}$/.test(String((p && p.milhar) || "")))) return false;

    const lixo = ["function","window","document","print","script","__","const ","var "];

    for(const palavra of lixo){
      if(titulo.includes(palavra)) return false;
      if(loteria.includes(palavra)) return false;
    }

    return true;
  });
}

const TZ = "America/Sao_Paulo";
let filtroData = "todos";

function isoHoje(){ return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
function isoOntem(){ return new Date(Date.parse(isoHoje() + "T12:00:00Z") - 864e5).toISOString().slice(0,10); }
function isoDoItem(item){
  if(item.dataISO) return item.dataISO;
  const m = String(item.data || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : "";
}
function tituloDoDia(iso){
  if(!iso) return "Sem data";
  const br = iso.split("-").reverse().join("/");
  if(iso === isoHoje()) return "Hoje • " + br;
  if(iso === isoOntem()) return "Ontem • " + br;
  return br;
}
function lerPremios(item){
  try{
    const p = typeof item.premios === "string" ? JSON.parse(item.premios) : item.premios;
    return Array.isArray(p) ? p : [];
  }catch(e){ return []; }
}

function renderizar(lista){
  lista = [...lista].sort((a,b)=>ordem(b)-ordem(a));
  if(!lista.length){
    grid.innerHTML = `<div class="empty">Nenhum resultado encontrado para este filtro.</div>`;
    return;
  }
  let diaAtual = null;
  grid.innerHTML = lista.map(item => {
    const iso = isoDoItem(item);
    let titulo = "";
    if(iso !== diaAtual){
      diaAtual = iso;
      titulo = `<h2 class="diaTitulo">${escapeHtml(tituloDoDia(iso))}</h2>`;
    }
    const hora = item.hora || item.horario || "";
    const atualizado = item.atualizadoFonte ? `Atualizado: ${escapeHtml(item.atualizadoFonte)}` : "";
    return titulo + `
      <article class="card">
        <div class="cardTop">
          <div>
            <span class="loteriaNome">${escapeHtml(item.loteria || "")}</span>
            <span class="cardData">${escapeHtml(item.data || "")}</span>
          </div>
          <span class="horarioDestaque ${hora ? "" : "semHora"}">${hora ? escapeHtml(hora) : "—"}</span>
        </div>
        <table>
          <thead>
            <tr><th>Prêmio</th><th>Milhar</th><th>Bicho</th></tr>
          </thead>
          <tbody>
            ${lerPremios(item).map(p => `
              <tr>
                <td>${escapeHtml(p.posicao || "")}</td>
                <td class="milhar">${escapeHtml(p.milhar || "")}</td>
                <td>${escapeHtml(p.bicho || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="cardRodape">
          <span>${atualizado}</span>
          <button class="share" data-id="${escapeHtml(item.id || "")}" onclick="compartilhar(this.dataset.id)">Enviar no WhatsApp</button>
        </div>
      </article>
    `;
  }).join("");
}

window.aplicarFiltro = function(){
  const valor = select.value;
  const alvo = filtroData === "hoje" ? isoHoje() : filtroData === "ontem" ? isoOntem() : "";
  renderizar(todosResultados.filter(item =>
    (valor === "todas" || normalizar(item.loteria) === normalizar(valor)) &&
    (!alvo || isoDoItem(item) === alvo)
  ));
};

window.filtrarData = function(d, el){
  document.querySelectorAll("#datas .tag").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  filtroData = d;
  aplicarFiltro();
};

window.compartilhar = function(id){
  const item = todosResultados.find(r => r.id === id);
  if(!item) return;
  const hora = item.hora || item.horario || "";
  const linhas = lerPremios(item).map(p => `${p.posicao} ${p.milhar}${p.bicho ? " - " + p.bicho : ""}`);
  const texto = `*${item.loteria}${hora ? " • " + hora : ""}*\n${item.data || ""}\n\n${linhas.join("\n")}\n\n${location.href}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener");
};

window.filtrarRapido = function(nome, el){
  tags.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  select.value = nome;
  aplicarFiltro();
};

function montarFiltros(){
  const loterias = [...new Set(todosResultados.map(r => r.loteria).filter(Boolean))].sort();
  const valorAtual = select.value;

  select.innerHTML = `<option value="todas">Todas as loterias</option>`;

  loterias.forEach(nome => {
    const opt = document.createElement("option");
    opt.value = nome;
    opt.textContent = nome;
    select.appendChild(opt);
  });

  if(valorAtual === "todas" || loterias.includes(valorAtual)){
    select.value = valorAtual;
  }

  const principais = [
    "todas",
    "PT-SP",
    "PT-RIO",
    "LOOK LOTERIAS",
    "BANDEIRANTES",
    "LOTECE",
    "MALUCA BAHIA",
    "BOA SORTE GOIÁS"
  ];

  tags.innerHTML = principais.map(nome => `
    <div class="tag ${normalizar(nome) === normalizar(select.value) ? "active" : ""}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarRapido('${nome}', this)">
      ${nome === "todas" ? "Todas" : nome}
    </div>
  `).join("");
}

select.addEventListener("change", aplicarFiltro);

function aoReceber(snap){
  todosResultados = limparDocumentosInvalidos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  montarFiltros();
  statusEl.textContent = "Última atualização da tela: " + new Date().toLocaleString("pt-BR");
  aplicarFiltro();
}

function erroAoCarregar(err){
  console.error(err);
  statusEl.textContent = "Erro ao carregar resultados.";
}

// Lê só os 150 mais recentes (evita ler o banco inteiro a cada visita).
// Se nenhum documento tiver "dataOrdenacao", cai para a leitura simples.
const recentes = query(collection(db, "resultados"), orderBy("dataOrdenacao", "desc"), limit(150));
const simples = query(collection(db, "resultados"), limit(300));
let cancelarSimples = null;

onSnapshot(recentes, snap => {
  if(snap.empty){
    if(!cancelarSimples) cancelarSimples = onSnapshot(simples, aoReceber, erroAoCarregar);
    return;
  }
  if(cancelarSimples){ cancelarSimples(); cancelarSimples = null; }
  aoReceber(snap);
}, erroAoCarregar);
</script>

</body>
</html>
