<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#040a14">
<title>Resultados Kelly Menezes JB</title>

<style>
:root{
  --bg:#040a14; --card:#0d1a2e; --card2:#10213a;
  --blue:#22d3ee; --green:#34f5a1; --gold:#fbbf24;
  --text:#f1f5f9; --muted:#8b9bb4; --line:rgba(148,163,184,.16);
  --grad:linear-gradient(135deg,var(--blue),var(--green));
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 420px at 15% -5%,rgba(34,211,238,.16),transparent 60%),
    radial-gradient(800px 400px at 100% 0%,rgba(52,245,161,.10),transparent 60%),
    linear-gradient(180deg,#07142a,var(--bg) 55%,#000) fixed;
}
.container{width:min(1200px,94%);margin:auto;padding:22px 0 48px}

.hero{
  position:relative;overflow:hidden;text-align:center;
  background:linear-gradient(160deg,rgba(16,33,58,.92),rgba(7,18,35,.92));
  border:1px solid var(--line);border-radius:28px;
  padding:34px 18px 30px;margin-bottom:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.hero::before{
  content:"";position:absolute;left:50%;top:0;width:60%;height:3px;
  transform:translateX(-50%);background:var(--grad);border-radius:0 0 6px 6px;
}
.hero h1{font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:-1.2px;line-height:1.1}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{
  display:inline-block;margin-top:14px;padding:7px 16px;border-radius:999px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);
  color:#bae6fd;font-size:14px;font-weight:800;letter-spacing:.3px;
}

.topbar{
  position:sticky;top:10px;z-index:10;
  background:rgba(4,10,20,.82);border:1px solid var(--line);border-radius:22px;
  padding:14px;margin-bottom:20px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px}
select,button{
  border-radius:14px;border:1px solid var(--line);
  padding:13px 16px;font-size:15px;font-weight:800;font-family:inherit;
}
select{
  background:var(--card);color:var(--text);outline:none;cursor:pointer;
  transition:border-color .2s,box-shadow .2s;
}
select:focus,button:focus-visible,.tag:focus-visible{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,211,238,.25);outline:none;
}
button{
  background:var(--grad);color:#021018;border:0;cursor:pointer;
  transition:transform .15s,filter .2s,box-shadow .2s;
  box-shadow:0 6px 18px rgba(34,211,238,.25);
}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}

.tags{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;
}
.tag{
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:#cbd5e1;
  font-size:12.5px;font-weight:800;cursor:pointer;user-select:none;
  transition:all .18s;
}
.tag:hover{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.4);color:#fff}
.tag.active{background:var(--grad);border-color:transparent;color:#021018}

.status{
  margin-top:12px;text-align:center;color:var(--muted);font-size:12.5px;
}
.status::before{
  content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;
  background:var(--green);box-shadow:0 0 0 0 rgba(52,245,161,.6);
  animation:pulso 2s infinite;vertical-align:middle;
}
@keyframes pulso{70%{box-shadow:0 0 0 7px rgba(52,245,161,0)}100%{box-shadow:0 0 0 0 rgba(52,245,161,0)}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}

.card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:22px;padding:16px;
  box-shadow:0 14px 34px rgba(0,0,0,.30);
  animation:entra .45s ease both;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.9}
.card:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.35);box-shadow:0 18px 40px rgba(0,0,0,.42)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.infoItem{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:10px 12px;
}
.infoLabel{
  display:block;color:var(--muted);font-size:10.5px;letter-spacing:.8px;
  text-transform:uppercase;font-weight:900;margin-bottom:4px;
}
.infoValue{font-size:13.5px;font-weight:800}
.loteriaNome{color:var(--green)}
.horarioDestaque{color:var(--blue);font-size:17px;font-weight:900}

table{
  width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
}
th,td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
th{
  color:var(--muted);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
  background:rgba(255,255,255,.04);
}
td{font-size:14px;background:rgba(255,255,255,.02);color:#cbd5e1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(34,211,238,.06)}
tbody tr:first-child td{background:rgba(251,191,36,.08)}
tbody tr:first-child .milhar{color:var(--gold)}
.milhar{
  font-size:21px;font-weight:900;color:#fff;letter-spacing:1.5px;
  font-variant-numeric:tabular-nums;
}

.empty{
  grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted);
  border:1px dashed var(--line);border-radius:22px;background:rgba(255,255,255,.02);
}

footer{margin-top:30px;text-align:center;color:var(--muted);font-size:13px}

@media(max-width:700px){
  .container{width:min(100% - 18px,1200px);padding-top:14px}
  .hero{padding:26px 14px 24px;border-radius:24px}
  .controls{grid-template-columns:1fr}
  button{width:100%}
  .tags{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .tags::-webkit-scrollbar{display:none}
  .tag{white-space:nowrap;flex:0 0 auto}
  .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="container">

  <section class="hero">
    <h1>Resultados <span>Kelly Menezes JB</span></h1>
    <p>Chama no milhar!</p>
  </section>

  <section class="topbar">
    <div class="controls">
      <select id="loteriaSelect">
        <option value="todas">Todas as loterias</option>
      </select>

      <button onclick="aplicarFiltro()">Atualizar tela</button>
    </div>

    <div class="tags" id="tags"></div>
    <div class="status" id="status">Carregando resultados...</div>
  </section>

  <main class="grid" id="gridResultados"></main>

  <footer>© Kelly Menezes JB •</footer>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6iyfXbCt-fHL5Wt5zNS5myKq-njJzbms",
  authDomain: "resultados-loterias-3979a.firebaseapp.com",
  projectId: "resultados-loterias-3979a",
  storageBucket: "resultados-loterias-3979a.firebasestorage.app",
  messagingSenderId: "109416331388",
  appId: "1:109416331388:web:8e04783520d08adc87b1f9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("gridResultados");
const statusEl = document.getElementById("status");
const select = document.getElementById("loteriaSelect");
const tags = document.getElementById("tags");

let todosResultados = [];

function escapeHtml(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function normalizar(texto){
  return String(texto || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function paraNumero(v){
  if(!v) return 0;
  if(typeof v.toMillis === "function") return v.toMillis(); // Timestamp do Firestore
  const n = Number(v);
  return Number.isNaN(n) ? 0 : n;
}

function ordem(item){
  return paraNumero(item.dataOrdenacao) || paraNumero(item.atualizado) ||
         paraNumero(item.updatedAt) || paraNumero(item.createdAt);
}

function limparDocumentosInvalidos(lista){
  lista = lista.map(item => ({ ...item, loteria: item.loteria || item.titulo || "" }));

  return lista.filter(item => {
    const titulo = String(item.titulo || "").toLowerCase();
    const loteria = String(item.loteria || "").toLowerCase();

    if(!item.loteria) return false;
    if(!item.premios || (Array.isArray(item.premios) && !item.premios.length)) return false;
    if(Array.isArray(item.premios) && item.premios.some(p => !/^\d{4}$/.test(String((p && p.milhar) || "")))) return false;

    const lixo = ["function","window","document","print","script","__","const ","var "];

    for(const palavra of lixo){
      if(titulo.includes(palavra)) return false;
      if(loteria.includes(palavra)) return false;
    }

    return true;
  });
}

function renderizar(lista){
  lista = [...lista].sort((a,b)=>ordem(b)-ordem(a));

  if(!lista.length){
    grid.innerHTML = `<div class="empty">Nenhum resultado encontrado.</div>`;
    return;
  }

  grid.innerHTML = lista.map(item => {
    let premios = [];

    try{
      premios = typeof item.premios === "string"
        ? JSON.parse(item.premios)
        : Array.isArray(item.premios)
          ? item.premios
          : [];
    }catch(e){
      premios = [];
    }

    return `
      <article class="card">
        <div class="info">
          <div class="infoItem">
            <span class="infoLabel">Loteria</span>
            <span class="infoValue loteriaNome">${escapeHtml(item.loteria || "")}</span>
          </div>

          <div class="infoItem">
            <span class="infoLabel">Horário</span>
            <span class="infoValue horarioDestaque">${escapeHtml(item.hora || item.horario || "")}</span>
          </div>

          <div class="infoItem">
            <span class="infoLabel">Data</span>
            <span class="infoValue">${escapeHtml(item.data || "")}</span>
          </div>

          <div class="infoItem">
            <span class="infoLabel">Atualização</span>
            <span class="infoValue">${escapeHtml(item.atualizadoFonte || "")}</span>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Prêmio</th>
              <th>Milhar</th>
              <th>Bicho</th>
            </tr>
          </thead>

          <tbody>
            ${premios.map(p => `
              <tr>
                <td>${escapeHtml(p.posicao || "")}</td>
                <td class="milhar">${escapeHtml(p.milhar || "")}</td>
                <td>${escapeHtml(p.bicho || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </article>
    `;
  }).join("");
}

window.aplicarFiltro = function(){
  const valor = select.value;

  if(valor === "todas"){
    renderizar(todosResultados);
    return;
  }

  const filtrados = todosResultados.filter(item =>
    normalizar(item.loteria) === normalizar(valor)
  );

  renderizar(filtrados);
};

window.filtrarRapido = function(nome, el){
  document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  select.value = nome;
  aplicarFiltro();
};

function montarFiltros(){
  const loterias = [...new Set(todosResultados.map(r => r.loteria).filter(Boolean))].sort();
  const valorAtual = select.value;

  select.innerHTML = `<option value="todas">Todas as loterias</option>`;

  loterias.forEach(nome => {
    const opt = document.createElement("option");
    opt.value = nome;
    opt.textContent = nome;
    select.appendChild(opt);
  });

  if(valorAtual === "todas" || loterias.includes(valorAtual)){
    select.value = valorAtual;
  }

  const principais = [
    "todas",
    "PT-SP",
    "PT-RIO",
    "LOOK LOTERIAS",
    "BANDEIRANTES",
    "LOTECE",
    "MALUCA BAHIA",
    "BOA SORTE GOIÁS"
  ];

  tags.innerHTML = principais.map(nome => `
    <div class="tag ${normalizar(nome) === normalizar(select.value) ? "active" : ""}" onclick="filtrarRapido('${nome}', this)">
      ${nome === "todas" ? "Todas" : nome}
    </div>
  `).join("");
}

select.addEventListener("change", aplicarFiltro);

function aoReceber(snap){
  todosResultados = limparDocumentosInvalidos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  montarFiltros();
  statusEl.textContent = "Última atualização da tela: " + new Date().toLocaleString("pt-BR");
  aplicarFiltro();
}

function erroAoCarregar(err){
  console.error(err);
  statusEl.textContent = "Erro ao carregar resultados.";
}

// Lê só os 150 mais recentes (evita ler o banco inteiro a cada visita).
// Se nenhum documento tiver "dataOrdenacao", cai para a leitura simples.
const recentes = query(collection(db, "resultados"), orderBy("dataOrdenacao", "desc"), limit(150));
const simples = query(collection(db, "resultados"), limit(300));
let usouSimples = false;

onSnapshot(recentes, snap => {
  if(snap.empty && !usouSimples){
    usouSimples = true;
    onSnapshot(simples, aoReceber, erroAoCarregar);
    return;
  }
  aoReceber(snap);
}, erroAoCarregar);
</script>

</body>
</html>
