<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#040a14">
<title>Resultados Kelly Menezes JB</title>

<style>
:root{--bg:#07202d;--panel:#0c2238;--panel2:#11294a;--line:rgba(139,196,236,.18);--text:#eef6ff;--muted:#9db2c9;--blue:#59d9ff;--green:#58efbb;--gold:#ffd16b;--grad:linear-gradient(110deg,#66dfff,#63f0bc)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(ellipse 900px 480px at 8% -8%,rgba(30,140,190,.26),transparent 70%),
             radial-gradient(ellipse 700px 420px at 100% 10%,rgba(40,200,170,.10),transparent 70%),
             linear-gradient(160deg,#08212f,#081b2c 55%,#06121f) fixed}
.container{width:min(1240px,100% - 24px);margin:auto;padding:14px 0 40px}

.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand h1{font-size:clamp(21px,3.6vw,32px);font-weight:900;letter-spacing:-.6px;line-height:1.1}
.brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin-top:4px;color:var(--muted);font-size:13px;font-weight:700}
.quicklink{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid rgba(89,217,255,.35);background:rgba(89,217,255,.10);color:#bdf1ff;font-size:13px;font-weight:800;text-decoration:none;transition:background .2s}
.quicklink:hover{background:rgba(89,217,255,.22)}

.filtros{position:sticky;top:8px;z-index:10;display:grid;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:18px;
  background:rgba(7,25,41,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.linha{display:flex;align-items:center;gap:10px;min-width:0}
.rotulo{flex:0 0 52px;color:var(--muted);font-size:10.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
.tags,.datas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tags::-webkit-scrollbar,.datas::-webkit-scrollbar{display:none}
.tag{flex:0 0 auto;white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(139,196,236,.07);color:#d9ecfb;font-size:12.5px;font-weight:800;cursor:pointer;user-select:none;transition:all .18s}
.tag:hover{background:rgba(89,217,255,.16);border-color:rgba(89,217,255,.5)}
.tag.active{background:var(--grad);border-color:transparent;color:#04202e}
.tag:focus-visible,button:focus-visible,.quicklink:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.statusLinha{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulso 2s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 7px rgba(88,239,187,0)}0%{box-shadow:0 0 0 0 rgba(88,239,187,.6)}}
.btnAtualizar{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#d9ecfb;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.btnAtualizar:hover{background:rgba(89,217,255,.16)}

.grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.diaTitulo{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 2px 0;color:#7fe3ff;font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.diaTitulo::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(124,201,240,.4),transparent)}
.diaTitulo:first-child{margin-top:0}

.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 12px 30px rgba(2,10,20,.35);
  animation:entra .25s ease both;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(89,217,255,.45)}
@keyframes entra{from{opacity:0}to{opacity:1}}
.cardTop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;background:rgba(255,255,255,.035);border-bottom:1px solid var(--line)}
.loteriaNome{display:block;color:var(--green);font-size:15px;font-weight:900;letter-spacing:.3px}
.cardData{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;font-weight:700}
.horarioDestaque{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:var(--grad);color:#04202e;font-size:15px;font-weight:900}
.semHora{background:rgba(255,255,255,.08);color:var(--muted);font-weight:700}

.premios{padding:6px 8px}
.premio{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:8px;border-radius:12px}
.premio+.premio{border-top:1px solid rgba(255,255,255,.05)}
.pos{color:var(--muted);font-size:13px;font-weight:900}
.milhar{font-size:22px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums}
.bicho{color:#c3d3e6;font-size:13px;font-weight:700;text-align:right}
.premio.primeiro{background:linear-gradient(90deg,rgba(255,209,107,.15),rgba(255,209,107,.02))}
.premio.primeiro .pos,.premio.primeiro .milhar{color:var(--gold)}
.premio.primeiro .milhar{font-size:30px}

.cardRodape{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.share{padding:7px 13px;border-radius:999px;border:1px solid rgba(88,239,187,.3);background:rgba(88,239,187,.12);color:#7bf3cc;font:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:background .2s}
.share:hover{background:rgba(88,239,187,.24)}

.empty{grid-column:1/-1;padding:46px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}

@media(max-width:700px){
  .container{padding-top:10px}
  .brandbar{padding-bottom:10px}
  .brand p{font-size:12px}
  .quicklink{padding:8px 12px;font-size:12px}
  .filtros{position:static}
  .rotulo{display:none}
  .milhar{font-size:21px}
  .premio.primeiro .milhar{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="container">

  <header class="brandbar">
    <div class="brand">
      <h1>Resultados <span>Kelly Menezes JB</span></h1>
      <p>✦ Chama no milhar! ✦</p>
    </div>
    <a class="quicklink" href="https://kellymenezes.app/" target="_blank" rel="noopener noreferrer">Central Kelly ↗</a>
  </header>

  <section class="filtros">
    <select id="loteriaSelect" hidden><option value="todas">Todas as loterias</option></select>
    <div class="linha"><span class="rotulo">Loteria</span><div class="tags" id="tags"></div></div>
    <div class="linha"><span class="rotulo">Data</span>
      <div class="datas" id="datas"><div class="tag active" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('todos', this)">Todas</div><div class="tag" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('hoje', this)">Hoje</div><div class="tag" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="filtrarData('ontem', this)">Ontem</div></div>
    </div>
  </section>

  <div class="statusLinha">
    <div class="status" id="status">Carregando resultados...</div>
    <button class="btnAtualizar" onclick="aplicarFiltro()">Atualizar</button>
  </div>

  <main class="grid" id="gridResultados"></main>

  <footer>© Kelly Menezes JB</footer>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, where, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6iyfXbCt-fHL5Wt5zNS5myKq-njJzbms",
  authDomain: "resultados-loterias-3979a.firebaseapp.com",
  projectId: "resultados-loterias-3979a",
  storageBucket: "resultados-loterias-3979a.firebasestorage.app",
  messagingSenderId: "109416331388",
  appId: "1:109416331388:web:8e04783520d08adc87b1f9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("gridResultados");
const statusEl = document.getElementById("status");
const select = document.getElementById("loteriaSelect");
const tags = document.getElementById("tags");

let todosResultados = [];

function escapeHtml(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function normalizar(texto){
  return String(texto || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function paraNumero(v){
  if(!v) return 0;
  if(typeof v.toMillis === "function") return v.toMillis(); // Timestamp do Firestore
  const n = Number(v);
  return Number.isNaN(n) ? 0 : n;
}

function ordem(item){
  return paraNumero(item.dataOrdenacao) || paraNumero(item.atualizado) ||
         paraNumero(item.updatedAt) || paraNumero(item.createdAt);
}

function limparDocumentosInvalidos(lista){
  lista = lista.map(item => ({ ...item, loteria: item.loteria || item.titulo || "" }));

  return lista.filter(item => {
    const titulo = String(item.titulo || "").toLowerCase();
    const loteria = String(item.loteria || "").toLowerCase();

    if(!item.loteria) return false;
    if(!item.premios || (Array.isArray(item.premios) && !item.premios.length)) return false;
    if(Array.isArray(item.premios) && item.premios.some(p => !/^\d{4}$/.test(String((p && p.milhar) || "")))) return false;

    const lixo = ["function","window","document","print","script","__","const ","var "];

    for(const palavra of lixo){
      if(titulo.includes(palavra)) return false;
      if(loteria.includes(palavra)) return false;
    }

    return true;
  });
}

const TZ = "America/Sao_Paulo";
let filtroData = "todos";

function isoHoje(){ return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
function isoOntem(){ return new Date(Date.parse(isoHoje() + "T12:00:00Z") - 864e5).toISOString().slice(0,10); }
function isoDoItem(item){
  if(item.dataISO) return item.dataISO;
  const m = String(item.data || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : "";
}
function tituloDoDia(iso){
  if(!iso) return "Sem data";
  const br = iso.split("-").reverse().join("/");
  if(iso === isoHoje()) return "Hoje • " + br;
  if(iso === isoOntem()) return "Ontem • " + br;
  return br;
}
function lerPremios(item){
  try{
    const p = typeof item.premios === "string" ? JSON.parse(item.premios) : item.premios;
    return Array.isArray(p) ? p : [];
  }catch(e){ return []; }
}

function renderizar(lista){
  lista = [...lista].sort((a,b)=>ordem(b)-ordem(a));
  if(!lista.length){
    grid.innerHTML = `<div class="empty">Nenhum resultado encontrado para este filtro.</div>`;
    return;
  }
  let diaAtual = null;
  grid.innerHTML = lista.map(item => {
    const iso = isoDoItem(item);
    let titulo = "";
    if(iso !== diaAtual){
      diaAtual = iso;
      titulo = `<h2 class="diaTitulo">${escapeHtml(tituloDoDia(iso))}</h2>`;
    }
    const hora = item.hora || item.horario || "";
    const atualizado = item.atualizadoFonte ? `Atualizado: ${escapeHtml(item.atualizadoFonte)}` : "";
    return titulo + `
      <article class="card">
        <div class="cardTop">
          <div>
            <span class="loteriaNome">${escapeHtml(item.loteria || "")}</span>
            <span class="cardData">${escapeHtml(item.data || "")}</span>
          </div>
          <span class="horarioDestaque ${hora ? "" : "semHora"}">${hora ? escapeHtml(hora) : "—"}</span>
        </div>
        <div class="premios">
          ${lerPremios(item).map((p, i) => `
            <div class="premio ${i === 0 ? "primeiro" : ""}">
              <span class="pos">${escapeHtml(p.posicao || "")}</span>
              <span class="milhar">${escapeHtml(p.milhar || "")}</span>
              <span class="bicho">${escapeHtml(p.bicho || "")}</span>
            </div>
          `).join("")}
        </div>
        <div class="cardRodape">
          <span>${atualizado}</span>
          <button class="share" data-id="${escapeHtml(item.id || "")}" onclick="compartilhar(this.dataset.id)">Enviar no WhatsApp</button>
        </div>
      </article>
    `;
  }).join("");
}

window.aplicarFiltro = function(){
  const valor = select.value;
  const alvo = filtroData === "hoje" ? isoHoje() : filtroData === "ontem" ? isoOntem() : "";
  renderizar(todosResultados.filter(item =>
    (valor === "todas" || normalizar(item.loteria) === normalizar(valor)) &&
    (!alvo || isoDoItem(item) === alvo)
  ));
};

window.filtrarData = function(d, el){
  document.querySelectorAll("#datas .tag").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  filtroData = d;
  aplicarFiltro();
};

window.compartilhar = function(id){
  const item = todosResultados.find(r => r.id === id);
  if(!item) return;
  const hora = item.hora || item.horario || "";
  const linhas = lerPremios(item).map(p => `${p.posicao} ${p.milhar}${p.bicho ? " - " + p.bicho : ""}`);
  const texto = `*${item.loteria}${hora ? " • " + hora : ""}*\n${item.data || ""}\n\n${linhas.join("\n")}\n\n${location.href}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener");
};

window.filtrarRapido = function(nome, el){
  tags.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  select.value = nome;
  aplicarFiltro();
};

function montarFiltros(){
  const loterias = [...new Set(todosResultados.map(r => r.loteria).filter(Boolean))].sort();
  const valorAtual = select.value;

  select.innerHTML = `<option value="todas">Todas as loterias</option>`;

  loterias.forEach(nome => {
    const opt = document.createElement("option");
    opt.value = nome;
    opt.textContent = nome;
    select.appendChild(opt);
  });

  if(valorAtual === "todas" || loterias.includes(valorAtual)){
    select.value = valorAtual;
  }

  const fixas = ["PT-SP","PT-RIO","LOOK LOTERIAS","BANDEIRANTES","LOTECE","MALUCA BAHIA","BOA SORTE GOIÁS"];
  const extras = loterias.filter(n => !fixas.some(f => normalizar(f) === normalizar(n)));
  const principais = ["todas", ...fixas, ...extras];

  tags.innerHTML = principais.map(nome => `
    <div class="tag ${normalizar(nome) === normalizar(select.value) ? "active" : ""}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" data-nome="${escapeHtml(nome)}" onclick="filtrarRapido(this.dataset.nome, this)">
      ${nome === "todas" ? "Todas" : escapeHtml(nome)}
    </div>
  `).join("");
}

select.addEventListener("change", aplicarFiltro);

function aoReceber(snap){
  todosResultados = limparDocumentosInvalidos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  montarFiltros();
  statusEl.textContent = "Última atualização da tela: " + new Date().toLocaleString("pt-BR");
  aplicarFiltro();
}

function erroAoCarregar(err){
  console.error(err);
  statusEl.textContent = "Erro ao carregar resultados.";
}

// Lê só os últimos 10 dias (pelo campo "data" dd/mm/aaaa, que todos os documentos têm).
// Se não vier nada, cai para a leitura simples.
function datasRecentes(n){
  const base = Date.parse(isoHoje() + "T12:00:00Z");
  return Array.from({ length: n }, (_, i) =>
    new Date(base - i * 864e5).toISOString().slice(0,10).split("-").reverse().join("/"));
}
const recentes = query(collection(db, "resultados"), where("data", "in", datasRecentes(10)), limit(400));
const simples = query(collection(db, "resultados"), limit(300));
let cancelarSimples = null;

onSnapshot(recentes, snap => {
  if(snap.empty){
    if(!cancelarSimples) cancelarSimples = onSnapshot(simples, aoReceber, erroAoCarregar);
    return;
  }
  if(cancelarSimples){ cancelarSimples(); cancelarSimples = null; }
  aoReceber(snap);
}, erroAoCarregar);
</script>

</body>
</html>
